# Application Configuration
spring.application.name=atlas-financial-assistant
server.port=${PORT:8080}

# Database Configuration (Defaults to embedded H2 database for zero-latency cloud deployment, or PostgreSQL if configured)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:atlas_financial;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Telegram Bot Credentials
telegram.bot.username=${TELEGRAM_BOT_USERNAME:AtlasFinancial_123_bot}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:8972609699:AAFlT4cx5OEopywnNX7jgGga6iUL-bkSkcQ}

# AI & LLM Configuration
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}

# File Upload Configuration
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Logging Level
logging.level.com.atlas.financial=INFO
logging.level.org.telegram=INFO
